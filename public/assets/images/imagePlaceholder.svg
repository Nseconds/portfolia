<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#181511" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#ece8dc" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <!-- Diagonal hatch -->
  <line x1="0" y1="0" x2="800" y2="500" stroke="#181511" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="6,6" />
  <line x1="800" y1="0" x2="0" y2="500" stroke="#181511" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="6,6" />
  <!-- Center icon box -->
  <g transform="translate(400, 250)">
    <rect x="-120" y="-45" width="240" height="90" rx="4" fill="#fdfcf9" stroke="#181511" stroke-width="2" />
    <text x="0" y="-8" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#181511" letter-spacing="2">IMAGE PLACEHOLDER</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Caveat', cursive" font-size="18" fill="#ff4d8d">replace in src/assets/images/</text>
  </g>
</svg>
